name: Build mobile app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        run: echo "APP_VERSION=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test calculations
        run: npm test

      - name: Build and sync native assets
        run: npm run cap:sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../So-do-thuy-chuan_${APP_VERSION}_Android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: So-do-thuy-chuan_${{ env.APP_VERSION }}_Android
          path: So-do-thuy-chuan_${{ env.APP_VERSION }}_Android.apk
          if-no-files-found: error
          retention-days: 30

  ios-unsigned-ipa:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        run: echo "APP_VERSION=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Test calculations
        run: npm test

      - name: Build and sync native assets
        run: npm run cap:sync

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          cd ipa
          zip -qry "So-do-thuy-chuan_${APP_VERSION}_unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: So-do-thuy-chuan_${{ env.APP_VERSION }}_unsigned
          path: ipa/So-do-thuy-chuan_${{ env.APP_VERSION }}_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
